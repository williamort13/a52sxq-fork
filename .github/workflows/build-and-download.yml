name: Build and Download ROM

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Codename (e.g. a52sxq)'
        required: true
        default: 'a52sxq'

jobs:
  build-and-upload:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Free disk space (1/2)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/2)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            python3 python3-pip python3-venv zip unzip
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Optional: Use your repository secrets for signing if you have them, 
          # otherwise it will use default/test keys if available.
          if [ -n "${{ secrets.PLATFORM_KEY_PK8 }}" ]; then
            echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
            echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build ROM and generate zip
        run: |
          source ./buildenv.sh ${{ github.event.inputs.device }}
          # The -z flag forces the creation of a flashable zip
          unica make_rom -z

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: UN1CA-Flashable-Zip-${{ github.event.inputs.device }}
          path: out/*.zip
          if-no-files-found: error
